name: pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 1-5"   # 8 PM IST on trading days
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Cache the heavy downloads (master_data.json, prices.json, pms.sqlite)
      - uses: actions/cache@v4
        with:
          path: cache
          key: pms-cache-${{ github.run_id }}
          restore-keys: |
            pms-cache-
      - run: pip install -r requirements.txt
      - run: python -m engine.build_artifacts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
